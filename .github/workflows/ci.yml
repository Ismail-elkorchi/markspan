name: Markspan CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install --global npm@11.8.0
      - run: npm ci
      - run: npx playwright install chromium
      - if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - run: npm run build
      - run: npm test
      - run: npm run verify
      - run: npm pack --dry-run
